name: Idecsi
description: 'IDECSI is a Microsoft 365 and on-premises data security platform focused
  on Data Security Posture Management (DSPM) and Data Access Governance (DAG). It helps
  mid-size and large enterprises eliminate access, permission, and sharing risks across
  Microsoft 365, SharePoint, and file systems, with advanced monitoring, permission
  analysis, and user-driven security workflows. IDECSI serves large organizations such
  as L''Oreal, TotalEnergies, SNCF, Renault, and ADP, and aligns with regulatory frameworks
  including NIS2, DORA, and the EU AI Act. Surfaced as a portfolio company of Partech
  and added to the API Evangelist network; the company publishes a marketing site,
  blog, and help center but no public developer API or specification at this time.'
